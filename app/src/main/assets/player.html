<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  // Player oficial do YouTube (IFrame API)
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    new YT.Player("p", {
      videoId: "{{VIDEO_ID}}",
      width: "100%",
      height: "100%",
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: "{{ORIGIN}}" },
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onError: function (e) { try { BiruPlayer.onError(e.data); } catch (x) {} }
      }
    });
  }
</script>
</body>
</html>
